[package]
name = "router-widget"
version = "0.1.0"
edition = "2024"
description = "Always-on-top Windows status widget for an OPNsense firewall"
license = "MIT"
repository = "https://github.com/Ephpotle/opnsense-widget"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8.1"
toml = "1.1.8"
tray-icon = "0.20"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Graphics_Dwm"] }
